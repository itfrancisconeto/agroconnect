services:
  db:
    image: postgres:15-alpine
    container_name: agroconnect-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agroconnect_development
    ports:
      # Host port 5433 avoids conflicts with a local PostgreSQL on 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    container_name: agroconnect-api
    # Use bash explicitly so this works even if the file permission is lost after unzip.
    command: bash ./bin/dev
    volumes:
      # Hot reload: local backend files are mounted inside the container.
      - ./backend:/app
      # Keeps installed gems inside a Docker volume, not in the project folder.
      - bundle_cache:/usr/local/bundle
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      RAILS_LOG_TO_STDOUT: "true"
      DATABASE_HOST: db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: agroconnect_development
      FRONTEND_URL: http://localhost:5173,http://localhost:5174,http://192.168.1.22:5174
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

  frontend:
    build:
      context: ./frontend
    container_name: agroconnect-frontend
    command: npm run dev
    volumes:
      # Hot reload: local frontend files are mounted inside the container.
      - ./frontend:/app
      # Prevents the host bind mount from hiding node_modules installed in the image.
      - /app/node_modules
      # Shared folder
      - ./shared:/app/shared
    ports:
      - "5173:5173"
    environment:
      # This URL is used by the browser, so localhost is correct here.
      VITE_API_URL: http://localhost:3000/api/v1
    depends_on:
      - api
    stdin_open: true
    tty: true

  mobile:
    build:
      context: ./mobile
    container_name: agroconnect-mobile
    command: npm run dev -- --host 0.0.0.0 --port 5174
    volumes:
      - ./mobile:/app
      - /app/node_modules
      - ./shared:/app/shared
    ports:
      - "5174:5174"
    environment:
      VITE_API_URL: http://192.168.1.22:3000/api/v1
    depends_on:
      - api
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  bundle_cache:
